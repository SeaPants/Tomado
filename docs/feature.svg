<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1218"/>
      <stop offset="1" stop-color="#0a0c11"/>
    </linearGradient>
    <radialGradient id="breakGlow" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#34c759" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#34c759" stop-opacity="0"/>
    </radialGradient>
    <filter id="windowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-opacity="0.55"/>
    </filter>
    <filter id="minimalShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-opacity="0.55"/>
    </filter>

    <symbol id="ic-leaf" viewBox="0 0 24 24">
      <path d="M4 18 C 4 8, 12 4, 20 4 C 20 14, 14 20, 4 20 Z" fill="currentColor"/>
      <path d="M4 18 C 9 14, 14 9, 18 6" fill="none" stroke="#0d1014" stroke-width="1.2"
            stroke-linecap="round" opacity="0.5"/>
    </symbol>
    <symbol id="ic-skip" viewBox="0 0 24 24">
      <path d="M5 5 L 13 12 L 5 19 Z" fill="currentColor"/>
      <rect x="14" y="5" width="3" height="14" rx="0.5" fill="currentColor"/>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <g opacity="0.03">
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#fff" stroke-width="0.5"/>
    </pattern>
    <rect width="1280" height="720" fill="url(#grid)"/>
  </g>

  <!-- Title -->
  <g>
    <text x="80" y="100" fill="#ffffff" font-family="-apple-system, system-ui, Helvetica, Arial, sans-serif"
          font-size="72" font-weight="200" letter-spacing="-2">Tomado</text>
    <text x="80" y="138" fill="#9ca3af" font-family="-apple-system, system-ui, Helvetica, Arial, sans-serif"
          font-size="20" font-weight="400" letter-spacing="0.5">
      A minimalist Pomodoro timer that gets out of your way.
    </text>
  </g>

  <!-- ======= Standard window screenshot (left) ======= -->
  <g transform="translate(80, 200)" filter="url(#windowShadow)">
    <image href="screenshot.png" x="0" y="0" width="320" height="472"/>
  </g>

  <!-- ======= Minimal window screenshot (top right) ======= -->
  <g transform="translate(880, 240)" filter="url(#minimalShadow)">
    <image href="_minimal.png" x="0" y="0" width="240" height="153"/>
  </g>

  <!-- Label for minimal window -->
  <g transform="translate(880, 200)">
    <text fill="#3b82f6" font-family="-apple-system, system-ui, Helvetica, Arial, sans-serif"
          font-size="14" font-weight="600" letter-spacing="0.3">MINIMAL MODE</text>
    <text y="20" fill="#9ca3af" font-family="-apple-system, system-ui, Helvetica, Arial, sans-serif"
          font-size="11">Just the timer. Floating.</text>
  </g>

  <!-- ======= Strict break preview (bottom right, mockup) ======= -->
  <g transform="translate(880, 470)" filter="url(#minimalShadow)">
    <rect x="0" y="0" width="320" height="180" rx="14" fill="#0d1014" stroke="#2a2f38" stroke-width="0.5"/>
    <rect x="0" y="0" width="320" height="180" rx="14" fill="url(#breakGlow)"/>
    <g transform="translate(160, 32)" color="#34c759" opacity="0.85">
      <use href="#ic-leaf" x="-12" y="-12" width="24" height="24"/>
    </g>
    <text x="160" y="68" text-anchor="middle" fill="#9ca3af"
          font-family="-apple-system, system-ui, Helvetica, Arial, sans-serif"
          font-size="9" font-weight="500" letter-spacing="2">BREAK (1/4)</text>
    <text x="160" y="120" text-anchor="middle" fill="#e5e7eb"
          font-family="ui-monospace, SFMono-Regular, monospace" font-size="48" font-weight="200" letter-spacing="2">02:43</text>
    <text x="160" y="146" text-anchor="middle" fill="#d1d5db" opacity="0.75"
          font-family="-apple-system, system-ui, Helvetica, Arial, sans-serif" font-size="11">Look at something 20 feet away.</text>
    <g transform="translate(160, 164)">
      <circle cx="0" cy="0" r="11" fill="none" stroke="#9ca3af" stroke-width="1" opacity="0.3"/>
      <g color="#9ca3af">
        <use href="#ic-skip" x="-7" y="-7" width="14" height="14"/>
      </g>
    </g>
  </g>

  <!-- Label for strict break -->
  <g transform="translate(880, 430)">
    <text fill="#34c759" font-family="-apple-system, system-ui, Helvetica, Arial, sans-serif"
          font-size="14" font-weight="600" letter-spacing="0.3">STRICT BREAK</text>
    <text y="20" fill="#9ca3af" font-family="-apple-system, system-ui, Helvetica, Arial, sans-serif"
          font-size="11">Force you to actually rest.</text>
  </g>

  <!-- Center labels (between standard and minimal/break) -->
  <g transform="translate(490, 240)">
    <text fill="#3b82f6" font-family="-apple-system, system-ui, Helvetica, Arial, sans-serif"
          font-size="14" font-weight="600" letter-spacing="0.3">STANDARD MODE</text>
    <text y="20" fill="#9ca3af" font-family="-apple-system, system-ui, Helvetica, Arial, sans-serif"
          font-size="11">Tasks, timer, hierarchy — all in one window.</text>

    <g font-family="-apple-system, system-ui, Helvetica, Arial, sans-serif">
      <g transform="translate(0, 64)">
        <circle cx="6" cy="-3" r="2" fill="#3b82f6"/>
        <text x="20" fill="#d1d5db" font-size="12">Single window simplicity</text>
      </g>
      <g transform="translate(0, 88)">
        <circle cx="6" cy="-3" r="2" fill="#3b82f6"/>
        <text x="20" fill="#d1d5db" font-size="12">Keyboard-first</text>
      </g>
      <g transform="translate(0, 112)">
        <circle cx="6" cy="-3" r="2" fill="#3b82f6"/>
        <text x="20" fill="#d1d5db" font-size="12">Hierarchical tasks &amp; subtasks</text>
      </g>
      <g transform="translate(0, 136)">
        <circle cx="6" cy="-3" r="2" fill="#3b82f6"/>
        <text x="20" fill="#d1d5db" font-size="12">Notes attached to tasks</text>
      </g>
      <g transform="translate(0, 160)">
        <circle cx="6" cy="-3" r="2" fill="#3b82f6"/>
        <text x="20" fill="#d1d5db" font-size="12">Research-based timer presets</text>
      </g>
      <g transform="translate(0, 184)">
        <circle cx="6" cy="-3" r="2" fill="#3b82f6"/>
        <text x="20" fill="#d1d5db" font-size="12">Local-first (no account, no cloud)</text>
      </g>
    </g>
  </g>

  <!-- Footer tagline -->
  <text x="640" y="690" text-anchor="middle" fill="#6b7280"
        font-family="-apple-system, system-ui, Helvetica, Arial, sans-serif" font-size="12">
    macOS 14.0+ • Open source (MIT)
  </text>
</svg>
